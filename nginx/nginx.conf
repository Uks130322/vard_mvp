upstream django {
    server vardserver:8000;
}

server {

    listen 80;
    server_name varddev.tech www.varddev.tech;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /media {
        alias /code/app/media;
    }

}

server {
    listen 443 ssl;
    server_name varddev.tech;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
        proxy_pass http://django;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }

    location /media {
        alias /code/app/media;
    }

}